version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kawal-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kawal_root_secret
      MYSQL_DATABASE: kawal_db
      MYSQL_USER: kawal_user
      MYSQL_PASSWORD: kawal_pass
    ports:
      - "3306:3306"
    volumes:
      - kawal_db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - kawal-network

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kawal-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: kawal_user
      DB_PASSWORD: kawal_pass
      DB_NAME: kawal_db
    depends_on:
      - db
    networks:
      - kawal-network

volumes:
  kawal_db_data:

networks:
  kawal-network:
    driver: bridge
